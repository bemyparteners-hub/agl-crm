<style>
/* Layout: one centred card — logo, password, "stay unlocked" checkbox, button. Everything else is in the encrypted payload. */
:root{--bg:#EDF0F2;--surface:#FFFFFF;--ink:#16212B;--muted:#5A6976;--line:#D2D9DF;--accent:#B0521C;--accent-ink:#FFFFFF;--danger:#B42318;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;--body:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1318;--surface:#172028;--ink:#E6EBEF;--muted:#94A2AE;--line:#27323C;--accent:#E2864C;--accent-ink:#1A0F08;--danger:#F07467;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1318;--surface:#172028;--ink:#E6EBEF;--muted:#94A2AE;--line:#27323C;--accent:#E2864C;--accent-ink:#1A0F08;--danger:#F07467;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
form{display:grid;gap:14px;width:min(340px,100%);justify-items:center}
h1{margin:0;font:700 22px/1.1 var(--display);letter-spacing:-.01em}
input,button{font:inherit;color:inherit}
.pw{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:17px}
.pw:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.keep{display:flex;align-items:center;gap:10px;width:100%;font-size:15px;color:var(--muted)}
.keep input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.go{width:100%;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;border-radius:12px;padding:13px 14px;cursor:pointer}
.go:disabled{opacity:.6}
.err{margin:0;color:var(--danger);font-weight:600}
[hidden]{display:none!important}
</style>

const b64e = u => { let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };

// PBKDF2-SHA-256 -> AES-GCM 256, never extractable
async function derive(pw, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64d(salt), iterations:P.it}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function decryptApp(key){
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(P.iv)}, key, b64d(P.ct)));
}

/* ---------- IndexedDB (key-value) ---------- */
function db(){
  return new Promise((ok, ko) => {
    const r = indexedDB.open("carnetinox", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
}
async function tx(mode, fn){
  const d = await db();
  return new Promise((ok, ko) => {
    const t = d.transaction("kv", mode), req = fn(t.objectStore("kv"));
    t.oncomplete = () => { d.close(); ok(req.result); };
    t.onerror = t.onabort = () => { d.close(); ko(t.error); };
  });
}
const idb = {
  get: k => tx("readonly", s => s.get(k)),
  set: (k, v) => tx("readwrite", s => s.put(v, k)),
  del: k => tx("readwrite", s => s.delete(k))
};

/* ---------- start the decrypted app in this page ---------- */
function launch(html, key, remembered){
  window.__carnet = Object.freeze({key, salt:P.s, build:P.iv, built:P.b, remembered, derive, b64e, b64d, idb,
    lock: async () => { try { await idb.del("key"); } catch(e){} location.reload(); }});
  const doc = new DOMParser().parseFromString(html, "text/html");
  const scripts = [...doc.querySelectorAll("script")].map(s => { s.remove(); return s.textContent; });
  document.documentElement.replaceChild(document.adoptNode(doc.head), document.head);
  document.documentElement.replaceChild(document.adoptNode(doc.body), document.body);
  for (const code of scripts){ const s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); }
}

const form = document.getElementById("unlock"), pw = document.getElementById("pw"), keep = document.getElementById("keep"),
  go = document.getElementById("go"), err = document.getElementById("err");
form.addEventListener("submit", async e => {
  e.preventDefault();
  err.hidden = true; go.disabled = true; go.textContent = "Ouverture…";
  let key, html;
  try { key = await derive(pw.value.normalize("NFC"), P.s); html = await decryptApp(key); }
  catch(x){ go.disabled = false; go.textContent = "Déverrouiller"; err.hidden = false; pw.select(); return; }
  pw.value = "";
  let remembered = false;
  if (keep.checked){ try { await idb.set("key", key); remembered = true; } catch(x){} }
  else { try { await idb.del("key"); } catch(x){} }
  launch(html, key, remembered);
});

(async () => {
  try {
    const key = await idb.get("key");
    if (key) { const html = await decryptApp(key); launch(html, key, true); return; }
  } catch(e){ try { await idb.del("key"); } catch(x){} }
  form.hidden = false; pw.focus();
})();

if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
